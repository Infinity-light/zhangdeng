# 掌灯人 · 一键启动：docker compose up -d，然后打开 http://localhost:8787
# 零依赖 Node 服务，不构建镜像，源码只读挂载；数据（存档、日志、快照）落在 ./data，都是 JSON / JSONL。
services:
  zhangdeng:
    image: node:20-alpine
    container_name: zhangdeng
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.mjs"]
    env_file:
      - path: .env          # 没有 .env 也能启动（用离线演员）
        required: false
    environment:
      PORT: "8787"
      DATA_DIR: /data
    ports:
      - "${BIND:-127.0.0.1}:${HOST_PORT:-8787}:8787"
    volumes:
      - ./engine:/app/engine:ro
      - ./web:/app/web:ro
      - ./rulepacks:/app/rulepacks:ro
      - ./modules:/app/modules:ro
      - ./server.mjs:/app/server.mjs:ro
      - ./package.json:/app/package.json:ro
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
